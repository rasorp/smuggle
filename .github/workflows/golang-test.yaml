name: Golang - Test

on:
  # The release workflow will call this workflow to test the source code before
  # compilation, so we need to allow workflow triggers.
  workflow_call:
  push:
    branches:
      - "**"
    paths-ignore:
      - ".github/workflows/**"
      - ".gitignore"
      - "docs/**"
      - "README.md"

jobs:
  test:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "build/.go-version"
      - name: "Run gotestsum install"
        run: |
          go install gotest.tools/gotestsum@v1.13.0
      - name: "Run test"
        run: |
          make test
