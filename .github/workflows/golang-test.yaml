name: Golang - Test

on:
  # The release workflow will call this workflow to test the source code before
  # compilation, so we need to allow workflow triggers.
  workflow_call:
  push:
    branches:
      - "**"
    paths-ignore:
      - ".github/workflows/**"
      - ".gitignore"
      - "docs/**"
      - "README.md"

jobs:
  test:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "build/.go-version"
      - name: "Run gotestsum install"
        run: |
          go install gotest.tools/gotestsum@v1.13.0
      - name: "Run test"
        run: |
          make test
