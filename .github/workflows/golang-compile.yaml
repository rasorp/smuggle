name: Golang - Compile

on:
  # The release workflow will call this workflow to build the binaries, so we
  # need to allow workflow triggers.
  workflow_call:
  push:
    branches:
      - "**"
    paths-ignore:
      - ".github/workflows/**"
      - ".gitignore"
      - "docs/**"
      - "README.md"

jobs:
  compile:
    strategy:
      matrix:
        goos: ["linux"]
        goarch: ["amd64", "arm64"]
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "build/.go-version"
      - name: "Run compile"
        run: |
          make "bin/${{ matrix.goos }}_${{ matrix.goarch }}/smuggle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smuggle_${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/${{ matrix.goos }}_${{ matrix.goarch }}/smuggle
          retention-days: 14
