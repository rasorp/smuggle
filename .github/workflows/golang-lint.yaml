name: Golang - Lint

on:
  # The release workflow will call this workflow to lint the source code before
  # compilation, so we need to allow workflow triggers.
  workflow_call:
  push:
    branches:
      - "**"
    paths-ignore:
      - ".github/workflows/**"
      - ".gitignore"
      - "docs/**"
      - "README.md"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "build/.go-version"
      - name: "Run lint"
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.11.4
          args: --config=./build/lint/golangci.yaml
